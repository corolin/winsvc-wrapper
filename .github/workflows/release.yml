name: Release

on:
  push:
    tags: ["v*"]
    # Legacy tags are released by release-legacy.yml on the legacy branch;
    # without this ignore both workflows fire on the same tag (the v0.1.2-
    # legacy collision that had to be cancelled by hand).
    tags-ignore: ["v*-legacy*"]

permissions:
  contents: write

env:
  # Same e2e concurrency cap as CI (see ci.yml for the loader-stall rationale).
  RUST_TEST_THREADS: "4"

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test before packaging
        run: cargo test --all-targets
      # Distinct target dirs so the lite build cannot overwrite the full exe.
      - name: Build (release, full)
        run: cargo build --release --bin rsw
      - name: Build (release, lite)
        run: cargo build --release --no-default-features --bin rsw --target-dir target-lite
      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $full = "rsw.example-full-en.toml", "rsw.example-full-cn.toml"

          # Full manuals validate against the full build...
          foreach ($f in $full) {
            & target/release/rsw.exe validate $f | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$f failed full-build validation" }
          }

          # ...and the lite zips get the same manuals with the download
          # block stripped (markers in the templates), validated by the
          # lite exe before packing.
          foreach ($f in $full) {
            $strip = $false
            $lite = (Get-Content $f -Encoding UTF8) | Where-Object {
              if ($_ -match '^# >>>> download-begin') { $strip = $true; $false }
              elseif ($_ -match '^# >>>> download-end') { $strip = $false; $false }
              else { -not $strip }
            }
            $out = $f -replace '-full-', '-lite-'
            # WriteAllLines: UTF-8 without BOM in both pwsh 7 and Windows
            # PowerShell 5 (Set-Content defaults differ between them).
            [System.IO.File]::WriteAllLines((Join-Path (Get-Location) $out), @($lite))
            & target-lite/release/rsw.exe validate $out | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "$out failed lite-build validation" }
          }
          $liteFiles = Get-Item rsw.example-lite-*.toml | ForEach-Object { $_.FullName }

          Compress-Archive -Path (@("target/release/rsw.exe") + $full) -DestinationPath "rsw-$tag-x86_64-pc-windows-msvc-full.zip"
          Compress-Archive -Path (@("target-lite/release/rsw.exe") + $liteFiles) -DestinationPath "rsw-$tag-x86_64-pc-windows-msvc-lite.zip"
          Get-FileHash -Algorithm SHA256 rsw-*.zip | ForEach-Object { "{0}  {1}" -f $_.Hash, (Split-Path $_.Path -Leaf) } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rsw-*-full.zip
            rsw-*-lite.zip
            SHA256SUMS.txt

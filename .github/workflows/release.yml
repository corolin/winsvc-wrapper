name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release --bin rsw
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path target/release/rsw.exe -DestinationPath rsw-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: rsw-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip
